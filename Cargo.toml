[package]
name = "Embedabadable"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/rtc-core", "crates/bme280-core"]

[dependencies]
critical-section = "1"
esp-hal = { version = "1.1.1", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy"] }
embedded-hal-async = "1.0.0"
embassy-embedded-hal = "0.6.0"
embassy-executor = "0.10"
embassy-time = "0.4"
embassy-futures = "0.1"
embassy-sync = "0.8.0"
rtc-core = { path = "crates/rtc-core" }
bme280-core = { path = "crates/bme280-core" }
static_cell = "2.1.1"
font8x8 = { version = "0.3.1", features = ["unicode"], default-features = false }

[profile.dev]
opt-level = "s"    # embedded: always optimize for size, even in dev

[profile.release]
opt-level = "s"