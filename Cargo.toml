[package]
name = "Embedabadable"
version = "0.1.0"
edition = "2024"

[dependencies]
critical-section = "1"
esp-hal = { version = "1.1.1", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy"] }
embassy-executor = "0.10"
embassy-time = "0.4"
embassy-futures = "0.1"

[profile.dev]
opt-level = "s"    # embedded: always optimize for size, even in dev

[profile.release]
opt-level = "s"